<!DOCTYPE html>
<html lang="en">
<head>
	<title>Remember</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="text-bg-dark">
	<div class="h-100 d-flex align-items-center justify-content-center">
		<div class="px-4 py-5 my-5 text-center w-50">
			<h1 class="display-5 fw-bold">Welcome to Remember</h1>
			<div>
				<p class="lead mb-4">
					To start, select the application folder. If a patient.json file exists you will have the possibility to edit it.
					If not, you can complete the form and it will be uploaded automatically
				</p>
				<form method="post" enctype="multipart/form-data" id="uploadForm" class="text-start m-auto form-signin">

					<div class="mb-3">
						<label for="path" class="form-label">Project path</label>
						<input class="form-control" id="path" name="path">
					</div>

					<div class="mb-3">
						<label for="formFile" class="form-label">File</label>
						<input class="form-control" type="file" id="formFile" name="file">
					</div>

					<button type="submit" class="btn btn-light">Submit</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
