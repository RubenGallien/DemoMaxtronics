<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-bg-dark"></body>>
<div class="container py-5" style="max-width: 500px;">
<h1 class="mb-4">Patient</h1>
<form method="post" action="/upload_patient">

	<div class="mb-3">
		<label for="name" class="form-label">Name</label>
		<input type="text" class="form-control" id="name" name="name" value="{{ result.name }}">
	</div>

	<div class="mb-3">
		<label for="jobs" class="form-label">Jobs</label>
		<textarea class="form-control" id="jobs" name="jobs" rows="4">{{ result.jobs | join('\n') }}</textarea>
	</div>

	<div class="mb-3">
		<label for="children" class="form-label">Childrens</label>
		<textarea class="form-control" id="children" name="childrens" rows="4">{{ result.children | join('\n') }}</textarea>
	</div>

	<button type="submit" class="btn btn-primary">Save</button>
</form>
</div>
</body>
</html>
